# Self-hosted LLM stack.
# Start on a machine without GPU:   docker compose --profile cpu up -d --build
# Start on an NVIDIA GPU machine:   docker compose --profile gpu up -d --build
# All settings come from .env (see .env.example).
#
# Both profiles run the same gateway and monitoring; only the llama.cpp service differs
# (llm on CPU, llm-gpu with CUDA). Both are reachable as http://llm:8080 on "backend".
#
# Only the gateway (and the local Prometheus/Grafana UIs) are reachable from the host.
# For direct access to llama.cpp while debugging, add compose.dev.yaml (see there).

# Settings shared by both llama.cpp services, merged in with "<<: *llm".
x-llm: &llm
  restart: unless-stopped
  volumes:
    # Models are downloaded by scripts/download-model.sh; read-only is enough.
    - ./models:/models:ro
  command:
    - --model
    - /models/${MODEL_FILE:?set MODEL_FILE in .env}
    - --alias
    - ${MODEL_ALIAS:-local-model}
    - --host
    - 0.0.0.0
    - --port
    - "8080"
    - --ctx-size
    - ${CTX_SIZE:-4096}
    # Number of parallel request slots; the context is split between them.
    - --parallel
    - ${PARALLEL:-2}
    # Expose Prometheus metrics on /metrics.
    - --metrics
  # No ports: only reachable as http://llm:8080 from containers on "backend".
  networks: [backend]
  healthcheck:
    # /health returns 200 once the model is loaded, 503 while loading.
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  gateway:
    build: ./gateway
    profiles: [cpu, gpu]
    restart: unless-stopped
    environment:
      GATEWAY_BACKEND_URL: http://llm:8080
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:?set GATEWAY_API_KEYS in .env}
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-60}
      GATEWAY_RATE_LIMIT_BURST: ${GATEWAY_RATE_LIMIT_BURST:-10}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    networks: [frontend, backend]
    depends_on:
      # Start the gateway only once the model is loaded. Only one of the two llama.cpp
      # services exists per profile; required: false skips the one that is not active.
      llm:
        condition: service_healthy
        required: false
      llm-gpu:
        condition: service_healthy
        required: false

  llm:
    <<: *llm
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b12627}
    profiles: [cpu]

  llm-gpu:
    <<: *llm
    image: ${LLAMA_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b12627}
    profiles: [gpu]
    environment:
      # Same as --n-gpu-layers: how many layers run on the GPU (99 = all of them).
      LLAMA_ARG_N_GPU_LAYERS: ${GPU_LAYERS:-99}
    networks:
      backend:
        # Same hostname as the CPU service, so gateway and Prometheus need no changes.
        aliases: [llm]
    deploy:
      resources:
        reservations:
          # Requires the NVIDIA Container Toolkit on the host.
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gpu-exporter:
    # Runs nvidia-smi and exposes GPU utilisation, VRAM, temperature and power
    # as Prometheus metrics on :9835. GPU profile only.
    image: ${GPU_EXPORTER_IMAGE:-utkuozdemir/nvidia_gpu_exporter:1.19.0}
    profiles: [gpu]
    restart: unless-stopped
    environment:
      # "utility" makes the NVIDIA Container Toolkit mount nvidia-smi and NVML
      # into the container; compute (CUDA) access is not needed.
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # No ports: only Prometheus reads it. The image has no shell, so no healthcheck;
    # Prometheus' "up" metric shows whether it is reachable.
    networks: [backend]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.1}
    profiles: [cpu, gpu]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Keep a week of data; enough for a local stack and bounded on disk.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # "backend" to scrape llama.cpp, "frontend" to publish the UI port.
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.6}
    profiles: [cpu, gpu]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Open the stack dashboard right after login.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-stack.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Data source and dashboard are provisioned from the repo at startup.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  prometheus-data:
  grafana-data:

networks:
  # Normal network: lets the gateway publish its port to the host.
  frontend:
  # Internal network: no route to the host or the internet, only container to container.
  backend:
    internal: true
