# Prometheus pulls ("scrapes") /metrics from every target at a fixed interval
# and stores each value as a time series.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Our own gateway: requests, latency, time to first token, tokens per key.
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]

  # llama.cpp server (started with --metrics): token throughput, queue, slots.
  # Reachable only on the internal "backend" network, which Prometheus joins.
  - job_name: llm
    static_configs:
      - targets: ["llm:8080"]

  # GPU metrics from nvidia_gpu_exporter (gpu profile only).
  # DNS discovery instead of a static target: in the cpu profile the name does not
  # resolve, so there is simply no target, instead of one that is always down.
  - job_name: gpu
    dns_sd_configs:
      - names: ["gpu-exporter"]
        type: A
        port: 9835
        refresh_interval: 30s
    relabel_configs:
      # DNS discovery names the target by the container IP, which changes on every
      # restart and would start a new time series each time. Use a stable name instead.
      - target_label: instance
        replacement: gpu-exporter:9835
