name: Release

# Publish the gateway image to GitHub Container Registry (ghcr.io) for a version tag:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # The full CI (lint, tests, compose check, build, end-to-end test) must pass first.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish gateway image
    runs-on: ubuntu-24.04
    needs: ci
    permissions:
      contents: read
      # Allows GITHUB_TOKEN to push to this repository's packages on ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The tag must match the version in pyproject.toml, so the image tag and the
      # package version cannot drift apart.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' gateway/pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match gateway/pyproject.toml version $version"
            exit 1
          fi

      # Image tags from the Git tag: v1.2.3 -> 1.2.3, 1.2 and latest. Also adds OCI
      # labels such as org.opencontainers.image.source, which links the package to
      # this repository on GitHub.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
